name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # La versión de pnpm se toma de "packageManager" en package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Tests de la API
        run: pnpm --filter api test

      - name: Tests de la web
        run: pnpm --filter web test

      - name: Build
        run: pnpm build

  # CD de la DEMO PÚBLICA (datos ficticios): solo en push a main y únicamente si el CI pasó en verde.
  deploy-demo:
    name: Desplegar demo
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-finanzas-demo
      cancel-in-progress: false
    steps:
      # Nodo efímero en la tailnet, con la etiqueta tag:ci (solo puede llegar al servidor por SSH)
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Desplegar en el servidor
        run: tailscale ssh deploy@archlinux "sudo /usr/local/sbin/deploy-finanzas-demo ${{ github.sha }}"
      - name: Verificar la demo
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://finanzas-demo.srne0.dev/api/deudas > /dev/null
