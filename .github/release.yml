# Agrupa las notas generadas automáticamente por GitHub según las etiquetas de cada pull request.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Seguridad
      labels:
        - security
    - title: Nuevas funciones
      labels:
        - feature
    - title: Correcciones
      labels:
        - bug
    - title: Pruebas e integración continua
      labels:
        - test
        - ci
    - title: Refactor y mantenimiento
      labels:
        - refactor
        - chore
    - title: Otros cambios
      labels:
        - "*"
