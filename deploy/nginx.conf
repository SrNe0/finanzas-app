# Demo pública de Finanzas: estáticos + proxy de /api hacia la API (127.0.0.1:3001, misma red).

# Límite de ritmo SOLO para peticiones que modifican datos; las lecturas no se limitan.
map $request_method $es_escritura {
  default 0;
  POST    1;
  PUT     1;
  PATCH   1;
  DELETE  1;
}

# IP real del visitante (Cloudflare la envía en CF-Connecting-IP); si falta, la IP de la conexión.
map $http_cf_connecting_ip $ip_visitante {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

map $es_escritura $clave_limite {
  0 '';
  1 $ip_visitante;
}

# Una clave vacía no se limita. 5 escrituras por segundo y por IP, con una ráfaga de 10.
limit_req_zone $clave_limite zone=escrituras:10m rate=5r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tope de tamaño de las peticiones (la API no valida longitudes de texto)
  client_max_body_size 16k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req zone=escrituras burst=10 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $ip_visitante;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Los assets de Vite llevan hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA con BrowserRouter
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
